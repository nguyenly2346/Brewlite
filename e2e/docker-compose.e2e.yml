# Dùng cùng docker-compose.yml để chạy e2e.
# Lý do: docker-compose.yml nạp brewlite_database.sql (đã có sẵn schema + dữ liệu),
# nhưng backend lại chạy "prisma migrate deploy" nên bị lỗi P3005 trên database mới.
# Ở đây ta đánh dấu 2 migration là đã áp dụng (baseline) trước khi chạy backend.
services:
  backend:
    command:
      - sh
      - -c
      - >
        npx prisma migrate resolve --applied 20261020000000_init || true;
        npx prisma migrate resolve --applied 20261115000000_add_product_stock || true;
        npx prisma migrate deploy && node dist/src/main.js