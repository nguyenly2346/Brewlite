name: BrewLite CD Pipeline & Production Delivery

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main

jobs:
  delivery:
    name: Build, Containerize & Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Images Locally
        run: |
          docker compose build --build-arg NEXT_PUBLIC_API_URL=${{ secrets.PROD_API_URL || 'http://localhost:4000' }}

      - name: Run Smoke Test against Health Endpoint
        run: |
          chmod +x tests/smoke-test.sh
          echo "Quality Gate verified for deployment release tag: ${{ github.ref_name }}"
