name: BrewLite CD

on:
  push:
    branches: [main, 4_cd_real]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/brewlite

jobs:
  build-push:
    name: Build and push images to GHCR
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
      semver: ${{ steps.meta.outputs.semver }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        run: |
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "semver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "semver=" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API (tag = commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web (tag = commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PROD_API_URL || 'http://localhost:4000' }}
          tags: ${{ env.IMAGE_PREFIX }}-web:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  verify:
    name: Migrate, deploy and smoke test (real containers)
    needs: build-push
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.build-push.outputs.sha_tag }}
      DATABASE_URL: postgresql://brewlite:brewlite_password@localhost:5432/brewlite_db?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start database
        run: |
          docker compose -f docker-compose.cd.yml up -d db
          for i in $(seq 1 30); do
            docker compose -f docker-compose.cd.yml exec -T db pg_isready -U brewlite -d brewlite_db && break
            sleep 2
          done

      - name: Prisma migrate deploy (run by the workflow)
        run: |
          docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" \
            ${{ env.IMAGE_PREFIX }}-api:${{ env.IMAGE_TAG }} \
            npx prisma migrate deploy

      - name: Deploy API and Web
        run: |
          docker compose -f docker-compose.cd.yml up -d backend frontend

      - name: Smoke test (real endpoints)
        run: |
          chmod +x tests/smoke-test.sh
          for i in $(seq 1 30); do
            curl -fs http://localhost:4000/health >/dev/null && break
            sleep 3
          done
          ./tests/smoke-test.sh http://localhost:4000
          curl -fs -o /dev/null http://localhost:3000/

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.cd.yml logs --tail=100

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.cd.yml down -v

  release:
    name: Promote verified images (latest / semver)
    needs: [build-push, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag verified SHA images
        run: |
          for svc in api web; do
            SRC=${IMAGE_PREFIX}-${svc}:${{ needs.build-push.outputs.sha_tag }}
            docker buildx imagetools create -t ${IMAGE_PREFIX}-${svc}:latest "$SRC"
            if [ -n "${{ needs.build-push.outputs.semver }}" ]; then
              docker buildx imagetools create -t ${IMAGE_PREFIX}-${svc}:${{ needs.build-push.outputs.semver }} "$SRC"
            fi
          done

  deploy:
    name: Deploy to server over SSH (with rollback)
    needs: [build-push, release]
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy, smoke test, rollback on failure
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          NEW_TAG: ${{ needs.build-push.outputs.sha_tag }}
          PROD_URL: ${{ secrets.PROD_API_URL }}
        run: |
          install -m 600 /dev/null key && echo "$SSH_KEY" > key
          SSH="ssh -i key -o StrictHostKeyChecking=no $USER_NAME@$HOST"
          scp -i key -o StrictHostKeyChecking=no docker-compose.cd.yml $USER_NAME@$HOST:~/brewlite/docker-compose.cd.yml
          $SSH "cd ~/brewlite && PREV=\$(cat .current_tag 2>/dev/null || echo latest) && \
            IMAGE_TAG=$NEW_TAG docker compose -f docker-compose.cd.yml pull && \
            IMAGE_TAG=$NEW_TAG docker compose -f docker-compose.cd.yml run --rm backend npx prisma migrate deploy && \
            IMAGE_TAG=$NEW_TAG docker compose -f docker-compose.cd.yml up -d && \
            sleep 15 && \
            (curl -fs $PROD_URL/health && curl -fs $PROD_URL/products >/dev/null && echo $NEW_TAG > .current_tag) || \
            (echo 'Smoke failed, rolling back to '\$PREV && IMAGE_TAG=\$PREV docker compose -f docker-compose.cd.yml up -d && exit 1)"
