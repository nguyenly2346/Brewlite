name: BrewLite CI Pipeline

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]

jobs:
  lint-and-test:
    name: Lint, Unit Test and Build Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite_password
          POSTGRES_DB: brewlite_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install Root & App Dependencies
        run: |
          npm --prefix apps/api ci
          npm --prefix apps/web ci

      - name: Generate Prisma Client & Migrate Test DB
        env:
          DATABASE_URL: postgresql://brewlite:brewlite_password@localhost:5432/brewlite_db?schema=public
        run: |
          npm --prefix apps/api run prisma:generate
          npm --prefix apps/api run prisma:push

      - name: Seed Test DB
        env:
          DATABASE_URL: postgresql://brewlite:brewlite_password@localhost:5432/brewlite_db?schema=public
        run: npm --prefix apps/api run prisma:seed

      - name: Build Backend (NestJS)
        run: npm --prefix apps/api run build

      - name: Start API in background
        env:
          DATABASE_URL: postgresql://brewlite:brewlite_password@localhost:5432/brewlite_db?schema=public
          JWT_SECRET: brewlite_super_secret_jwt_key_2026
          PORT: 4000
        run: |
          nohup npm --prefix apps/api run start:prod > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/health && exit 0
            sleep 2
          done
          cat api.log
          exit 1

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql://brewlite:brewlite_password@localhost:5432/brewlite_db?schema=public
          JWT_SECRET: brewlite_super_secret_jwt_key_2026
        run: npm --prefix apps/api run test

      - name: Build Frontend (Next.js)
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: npm --prefix apps/web run build